# Gradle 运行参数
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# 注意：构建时必须让 Gradle 用 Java 25（Minecraft 26.2 要求，fabric-api 0.158.0+26.2 要求 java>=25）。
# 本机可用的 JDK 25（HMCL 自带运行时 java-runtime-epsilon）：
#   C:\Users\86187\AppData\Roaming\.hmcl\java\windows-x86_64\mojang-java-runtime-epsilon
# 例：$env:JAVA_HOME="C:\Users\86187\AppData\Roaming\.hmcl\java\windows-x86_64\mojang-java-runtime-epsilon"; .\gradlew.bat build

# 版本对应（26.2 起 Minecraft 不再混淆/发布 mappings，直接使用官方类名，无需 mappings 配置）
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2

mod_version=2.0.0
maven_group=com.deskpet
archives_base_name=deskpet-mod